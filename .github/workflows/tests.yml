name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sahay-senior-companion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sahay-senior-companion/backend/requirements.txt
      - run: pip install -r backend/requirements.txt ruff
      - run: ruff check backend
      - run: pytest backend/tests/ -v
